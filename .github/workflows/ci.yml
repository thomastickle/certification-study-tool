name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          check-latest: true
          cache: npm
      - run: npm ci
      - name: Load pinned standalone Flyway for administration tests
        run: docker pull --platform linux/amd64 redgate/flyway@sha256:b45087cccd267d326c5fd776bc06e9690e83509ce8bbf47acd65f1aa4a4b8b86
      - run: npm run check

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: study-tool:ci
          cache-from: type=gha,scope=study-tool
          cache-to: type=gha,mode=max,scope=study-tool
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: package.json
          check-latest: true
      - name: Initialize a fresh deployment with standalone Flyway
        run: |
          docker pull --platform linux/amd64 redgate/flyway@sha256:b45087cccd267d326c5fd776bc06e9690e83509ce8bbf47acd65f1aa4a4b8b86
          node scripts/database-admin.ts init /tmp/study-ci-data
      - name: Install prepared files into a genuinely empty Docker volume
        run: |
          docker volume create study-ci-data
          docker run --rm --user root --volume study-ci-data:/data --entrypoint node study-tool:ci -e "const fs = require('node:fs'); require('node:assert/strict').deepEqual(fs.readdirSync('/data'), []); fs.writeFileSync('/data/RESTART_BLOCKED', 'Installation incomplete. Do not start.\n', {flag:'wx',mode:0o600})"
          docker create --name study-tool --user "$(id -u):$(id -g)" --volume study-ci-data:/data --publish 127.0.0.1:3000:3000 study-tool:ci
          docker cp --archive /tmp/study-ci-data/. study-tool:/data
          docker run --rm --user root --volume study-ci-data:/data --entrypoint node study-tool:ci -e "require('node:assert/strict').equal(require('node:fs').readFileSync('/data/READY', 'utf8'), '1\n'); require('node:fs').unlinkSync('/data/RESTART_BLOCKED')"
      - name: Verify container health and web app
        run: |
          docker start study-tool
          for attempt in {1..30}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' study-tool)
            if [ "$status" = healthy ]; then
              curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null
              exit 0
            fi
            if [ "$status" = unhealthy ]; then
              break
            fi
            sleep 2
          done
          docker logs study-tool
          exit 1
      - name: Remove test container
        if: always()
        run: |
          docker rm --force study-tool || true
          docker volume rm study-ci-data || true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          check-latest: true
      - run: npm ci
      - name: Verify shared banks, private libraries and history against Keycloak
        env:
          STUDY_IMAGE: study-tool:ci
        run: node tests/shared-users-smoke.ts --project study-login-ci --app-url http://127.0.0.1:13000 --issuer http://127.0.0.1:18080/realms/study
