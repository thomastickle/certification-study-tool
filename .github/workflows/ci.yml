name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run check

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: study-tool:ci
          cache-from: type=gha,scope=study-tool
          cache-to: type=gha,mode=max,scope=study-tool
      - name: Verify container health and web app
        run: |
          docker run --detach --name study-tool --publish 127.0.0.1:3000:3000 study-tool:ci
          for attempt in {1..30}; do
            status=$(docker inspect --format '{{.State.Health.Status}}' study-tool)
            if [ "$status" = healthy ]; then
              curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null
              exit 0
            fi
            if [ "$status" = unhealthy ]; then
              break
            fi
            sleep 2
          done
          docker logs study-tool
          exit 1
      - name: Remove test container
        if: always()
        run: docker rm --force study-tool || true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          check-latest: true
      - name: Verify shared banks and private progress against Keycloak
        env:
          STUDY_IMAGE: study-tool:ci
        run: node tests/shared-users-smoke.ts --project study-login-ci --app-url http://127.0.0.1:13000 --issuer http://127.0.0.1:18080/realms/study
