services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ['start-dev', '--import-realm']
    environment:
      KC_HOSTNAME: http://127.0.0.1:${STUDY_KEYCLOAK_PORT:-8080}
      KC_HTTP_PORT: ${STUDY_KEYCLOAK_PORT:-8080}
      KC_HEALTH_ENABLED: 'true'
      STUDY_WEB_ORIGIN: ${STUDY_ORIGIN:-http://127.0.0.1:${STUDY_WEB_PORT:-3000}}
      STUDY_PREVIEW_ORIGIN: http://127.0.0.1:3100
    ports:
      - '127.0.0.1:${STUDY_KEYCLOAK_PORT:-8080}:${STUDY_KEYCLOAK_PORT:-8080}'
    volumes:
      - ./dev/keycloak:/opt/keycloak/data/import:ro
      - keycloak-data:/opt/keycloak/data
    mem_limit: 1g
    healthcheck:
      test:
        - CMD
        - bash
        - -ec
        - "{ printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&0; grep -q 'HTTP/1.0 200'; } 0<>/dev/tcp/127.0.0.1/9000"
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 24
    restart: unless-stopped
    init: true

volumes:
  keycloak-data:
