services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ['start-dev', '--import-realm']
    environment:
      KC_HOSTNAME: http://127.0.0.1:8080
    ports:
      - '127.0.0.1:8080:8080'
    volumes:
      - ./dev/keycloak:/opt/keycloak/data/import:ro
      - keycloak-data:/opt/keycloak/data
    mem_limit: 1g
    init: true

volumes:
  keycloak-data:
